<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>The Ledger — Smart Finance Tracker</title>
  
  <!-- SEO Meta Tags -->
  <meta name="description" content="Track expenses, manage budgets, analyze cash flow, and track investments. Beautiful, offline-first, private progressive web app." />
  <meta name="keywords" content="expense tracker, personal finance, budget manager, offline-first, pwa, portfolio tracker, finance app" />
  <meta name="theme-color" content="#09090B" />
  
  <!-- Apple PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="The Ledger" />
  <link rel="apple-touch-icon" href="/pwa-192x192.png" />
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="The Ledger — Smart Finance Tracker" />
  <meta property="og:description" content="Track expenses, manage budgets, and analyze wealth offline. Private, fast, and secure progressive web app." />
  <meta property="og:image" content="/pwa-512x512.png" />
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    (function() {
      try {
        const theme = localStorage.getItem('theme') || 'system';
        let effectiveTheme = theme;
        if (theme === 'system') {
          effectiveTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        } else if (theme === 'system-comfort') {
          effectiveTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'eye-comfort' : 'light';
        }
        if (effectiveTheme === 'dark') {
          document.documentElement.classList.add('dark');
        } else if (effectiveTheme === 'eye-comfort') {
          document.documentElement.classList.add('eye-comfort');
        }
      } catch (e) {}
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
