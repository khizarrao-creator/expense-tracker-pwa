<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Rounded corner app icon background -->
  <rect width="512" height="512" rx="128" fill="#10B981"/>
  
  <!-- Concept 2: Abstract geometric "L" mark in negative space (white) -->
  <!-- Composed of a vertical column and a horizontal block with balanced proportions and rounded caps, offset to create dynamic movement -->
  <g transform="translate(48, 48)">
    <!-- Vertical member -->
    <rect x="112" y="80" width="80" height="240" rx="40" fill="#FFFFFF"/>
    <!-- Floating horizontal member offset with dynamic negative space -->
    <rect x="216" y="240" width="160" height="80" rx="40" fill="#FFFFFF"/>
  </g>
</svg>